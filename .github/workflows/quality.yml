name: MicroSprouts quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check comp.js
          node --check shop.js
          node --check pages.js
          node --check worker.js
          node --check checkout.js
          node --check checkout-success.js
      - name: Verify webpage structure and ordering invariants
        run: |
          node tests/smoke.mjs
          node tests/payments.mjs
